name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Icons are reproducible from source
        run: |
          node tools/make-icons.js
          if ! git diff --quiet -- icons; then
            echo "::error::Committed icons differ from tools/make-icons.js output. Run: node tools/make-icons.js"
            git diff --stat -- icons
            exit 1
          fi

      - name: Build the standalone file
        run: node tools/build.js dist

      - run: npm install --no-save playwright@^1.49.0
      - run: npx playwright install --with-deps chromium

      - name: Smoke-test both distribution shapes
        run: node tests/smoke.mjs

      - name: Upload the standalone build
        uses: actions/upload-artifact@v4
        with:
          name: featherpad-html
          path: dist/featherpad.html
          if-no-files-found: error
